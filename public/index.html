<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phala Node Admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-block">
      <div class="brand-mark">PNA</div>
      <div>
        <h1>Phala Node Admin</h1>
        <div class="header-subtitle">Redpill Phala listings and PIG hot policy</div>
      </div>
    </div>
    <div class="header-actions">
      <label>
        <span>Search models</span>
        <input id="model-search" placeholder="qwen, gemma, deepseek">
      </label>
      <button id="refresh-btn" class="primary" type="button">Refresh Redpill</button>
      <button id="pig-refresh-btn" type="button">Refresh PIG</button>
    </div>
    <div id="status-line" class="status-line">loading</div>
  </header>

  <main>
    <section class="panel model-panel">
      <div class="panel-title">
        <span>Active Phala models</span>
        <span id="model-count" class="panel-subtitle">-</span>
      </div>
      <div id="model-list" class="model-list"></div>
    </section>

    <section class="center-stack">
      <section id="summary" class="summary-grid"></section>

      <section class="panel chart-panel">
        <div class="panel-title">
          <span id="pig-panel-title">PIG runtime</span>
          <span id="pig-panel-subtitle" class="panel-subtitle">waiting for metrics</span>
        </div>
        <div class="chart-shell">
          <canvas id="running-chart"></canvas>
          <div id="chart-tooltip" class="chart-tooltip" hidden></div>
        </div>
      </section>

      <section class="panel policy-panel">
        <div class="policy-head">
          <div>
            <div class="policy-title">PIG hot policy</div>
            <div id="pig-policy-target" class="subline mono">select a Phala node</div>
          </div>
          <div class="policy-actions">
            <button id="pig-policy-refresh-btn" type="button" disabled>Load policy</button>
            <button id="pig-policy-save-btn" class="primary" type="button" disabled>Save policy</button>
          </div>
        </div>
        <div class="policy-grid">
          <label>Load TPS<input id="pig-tps-reference" inputmode="numeric" placeholder="25"></label>
          <label>Window concurrency<input id="pig-window-concurrency" inputmode="numeric" placeholder="32"></label>
          <label>Running limit<input id="pig-running-limit" inputmode="numeric" placeholder="0"></label>
          <div class="policy-meta">
            <span>revision <strong id="pig-policy-revision" class="mono">-</strong></span>
            <span>source <strong id="pig-policy-source" class="mono">-</strong></span>
            <span>mode <strong id="pig-policy-mode" class="mono">-</strong></span>
          </div>
        </div>
        <div id="pig-policy-message" class="subline mono">select a node</div>
      </section>

      <section class="panel log-panel">
        <div class="panel-title">
          <span>Operation log</span>
          <button id="clear-log-btn" type="button">Clear</button>
        </div>
        <pre id="log"></pre>
      </section>
    </section>

    <section class="panel deployments-panel">
      <div class="panel-title">
        <span id="deployments-title">Nodes</span>
        <span id="deployments-subtitle" class="panel-subtitle">select a model</span>
      </div>
      <div class="deployment-toolbar">
        <button id="select-active-btn" type="button">Select active</button>
        <button id="select-inactive-btn" type="button">Select inactive</button>
        <button id="clear-selection-btn" type="button">Clear</button>
        <button id="bulk-up-btn" class="primary" type="button">Up selected</button>
        <button id="bulk-down-btn" class="danger" type="button">Down selected</button>
      </div>
      <div id="deployments-body" class="node-list"></div>
    </section>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
